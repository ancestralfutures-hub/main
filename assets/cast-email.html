<!doctype html>
<!--
  The header of the cast announcement email, drawn at 1200 by 675 and
  served as public/cast-email.jpg at 600 wide. The poster's night: the
  artist's star sky, the two carved birds standing the full height of the
  frame and fading into the sky, the orange dust, and the cast in cream
  capitals between them. The same ground and the same pieces as
  /cast.html, so the email and the cards match.

  To regenerate, serve the repository root and screenshot this page at
  1200 by 675 with the headless Chrome helper, then write it as JPEG:

    python3 -m http.server 8125
    node cdp.mjs http://localhost:8125/assets/cast-email.html 1200 675 out.png "window.done"
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; }
  html, body { width:1200px; height:675px; overflow:hidden; background:#0b0d0c; }
  canvas { display:block; }
</style>
</head>
<body>
<canvas id="c" width="1200" height="675"></canvas>
<script>
const P = { ground:'#0b0d0c', cream:'#f9f5cd', orange:'#f43e00', muted:'#908f78' };
const FONT = "Figtree,'Helvetica Neue',Arial,sans-serif";
const CAST = ['Afronaut Zu', 'Ahnansé', 'Lex Amor', 'Zola Marcelle', 'MA.MOYO'];

const ART = {};
const load = (name, src) => new Promise((res) => { const i = new Image(); i.onload = () => { ART[name] = i; res(); }; i.onerror = () => { ART[name] = null; res(); }; i.src = src; });

const stencil = document.createElement('canvas');
function drawArt(ctx, img, x, y, w, h, colour, alpha) {
  if (!img) return;
  stencil.width = Math.max(1, Math.round(w)); stencil.height = Math.max(1, Math.round(h));
  const s = stencil.getContext('2d'); s.clearRect(0, 0, stencil.width, stencil.height);
  s.drawImage(img, 0, 0, stencil.width, stencil.height);
  s.globalCompositeOperation = 'source-in'; s.fillStyle = colour; s.fillRect(0, 0, stencil.width, stencil.height);
  s.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.drawImage(stencil, x, y, w, h); ctx.restore();
}
function tracked(ctx, text, tr) { let w = 0; for (const ch of text) w += ctx.measureText(ch).width + tr; return w - tr; }
function fillTracked(ctx, text, x, y, tr) { let cx = x; for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + tr; } }
function centreTracked(ctx, text, cx, y, tr) { fillTracked(ctx, text, cx - tracked(ctx, text, tr) / 2, y, tr); }

(async function () {
  await Promise.all([load('stars', '../public/art/stars.jpg'), load('figL', '../public/art/figure-left.png'), load('figR', '../public/art/figure-right.png'), load('word', '../public/art/wordmark.png')]);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const c = document.getElementById('c'), ctx = c.getContext('2d'), W = c.width, H = c.height;

  // the sky
  ctx.fillStyle = P.ground; ctx.fillRect(0, 0, W, H);
  if (ART.stars) { const img = ART.stars, s = Math.max(W / img.width, H / img.height); ctx.drawImage(img, (W - img.width * s) / 2, 0, img.width * s, img.height * s); }

  // the dust
  for (let i = 0; i < 9000; i++) {
    const r = Math.random(); const d = r < 0.7 ? 1 : r < 0.93 ? 1.6 : 2.4;
    ctx.globalAlpha = (0.25 + Math.random() * 0.65) * 0.7; ctx.fillStyle = Math.random() < 0.8 ? P.orange : '#ff8a4a';
    ctx.fillRect(Math.random() * W, Math.random() * H, d, d);
  }
  ctx.globalAlpha = 1;

  // the birds, full height, fading into the sky
  const fig = document.createElement('canvas'); fig.width = W; fig.height = H; const f = fig.getContext('2d');
  if (ART.figL) { const w = H * (ART.figL.width / ART.figL.height); drawArt(f, ART.figL, -w * 0.3, 0, w, H, P.orange, 1); }
  if (ART.figR) { const w = H * (ART.figR.width / ART.figR.height); drawArt(f, ART.figR, W - w * 0.7, 0, w, H, P.orange, 1); }
  const g = f.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(0.22, 'rgba(0,0,0,0.12)'); g.addColorStop(0.55, 'rgba(0,0,0,1)');
  f.globalCompositeOperation = 'destination-in'; f.fillStyle = g; f.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.5; ctx.drawImage(fig, 0, 0); ctx.globalAlpha = 1;

  // the words
  ctx.textBaseline = 'top';
  ctx.fillStyle = P.orange; ctx.font = `800 30px ${FONT}`;
  centreTracked(ctx, 'CAST ANNOUNCEMENT', W / 2, 54, 30 * 0.14);
  if (ART.word) { const ww = 150, wh = ww * (ART.word.height / ART.word.width); drawArt(ctx, ART.word, W / 2 - ww / 2, 104, ww, wh, P.cream, 1); }

  ctx.fillStyle = P.cream;
  const size = 58, gap = 66;
  let y = 196;
  for (const name of CAST) { ctx.font = `800 ${size}px ${FONT}`; centreTracked(ctx, name.toUpperCase(), W / 2, y, size * 0.04); y += gap; }
  ctx.fillStyle = P.orange; ctx.font = `600 26px ${FONT}`;
  centreTracked(ctx, 'AND A FEW SURPRISES', W / 2, y + 10, 26 * 0.14);

  ctx.fillStyle = P.muted; ctx.font = `600 18px ${FONT}`;
  centreTracked(ctx, 'SATURDAY 7 NOVEMBER  ·  BERNIE GRANT ARTS CENTRE  ·  DOORS 7PM', W / 2, H - 50, 18 * 0.12);

  window.done = true;
})();
</script>
</body>
</html>
