<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>DARÉ · Cast and crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:ital,wght@0,400;0,600;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --ground:#0b0d0c; --cream:#f9f5cd; --orange:#f43e00;
    --muted:#908f78; --line:#24241e; --panel:#121410;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--ground); color:var(--cream);
    font-family:Figtree,'Helvetica Neue',Arial,sans-serif; font-weight:400;
    line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  a { color:var(--orange); }
  header {
    position:sticky; top:0; z-index:20; display:flex; flex-wrap:wrap; gap:14px;
    align-items:center; justify-content:space-between;
    padding:14px 24px; background:rgba(11,13,12,.94); backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  header h1 { font-size:15px; font-weight:800; letter-spacing:.14em; text-transform:uppercase; }
  header .meta { font-size:12px; color:var(--muted); letter-spacing:.06em; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; }
  button, .filebtn {
    font:inherit; font-size:12px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
    color:var(--cream); background:transparent; border:1px solid #3d3c33;
    padding:9px 16px; cursor:pointer; transition:background .2s,color .2s,border-color .2s;
    display:inline-block;
  }
  button:hover, .filebtn:hover { background:var(--cream); color:var(--ground); border-color:var(--cream); }
  button.primary { background:var(--orange); border-color:var(--orange); color:var(--ground); }
  button.primary:hover { background:var(--cream); border-color:var(--cream); }
  button.on { background:var(--orange); border-color:var(--orange); color:var(--ground); }
  button.quiet { border-color:var(--line); color:var(--muted); }
  button:disabled { opacity:.4; cursor:default; }
  .filebtn input { display:none; }

  .wrap { max-width:1400px; margin:0 auto; padding:26px 24px 120px; }
  .intro { max-width:64ch; margin-bottom:28px; }
  .intro h2 { font-size:28px; font-weight:800; letter-spacing:-.01em; margin-bottom:12px; }
  .intro p { color:#bdbb9d; margin-bottom:10px; font-size:15px; }

  .studio { display:grid; grid-template-columns:220px minmax(280px,440px) 1fr; gap:30px; align-items:start; }
  @media (max-width:1100px) { .studio { grid-template-columns:220px 1fr; } .controls { grid-column:1 / -1; } }
  @media (max-width:760px) { .studio { grid-template-columns:1fr; } }

  .cards h3, .controls h3, .stage h3 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--orange); font-weight:800; margin-bottom:10px; }
  .cards .list { display:grid; gap:10px; }
  .card {
    border:1px solid var(--line); background:var(--panel); cursor:pointer; padding:8px;
    display:grid; grid-template-columns:54px 1fr; gap:10px; align-items:center;
  }
  .card.on { border-color:var(--orange); }
  .card canvas { width:54px; height:54px; display:block; background:#000; }
  .card .who { font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card .what { font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .stage canvas { width:100%; height:auto; display:block; background:#000; border:1px solid var(--line); }
  .stage .note { font-size:12px; color:var(--muted); margin-top:8px; letter-spacing:.04em; min-height:18px; }
  .stage .acts { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }

  .controls { display:grid; gap:14px; }
  label.f { display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); }
  label.f input[type=text], label.f textarea {
    display:block; width:100%; margin-top:5px; font:inherit; font-size:14px;
    color:var(--cream); background:var(--panel); border:1px solid var(--line);
    padding:9px 11px; border-radius:0; resize:vertical;
  }
  label.f input:focus, label.f textarea:focus { outline:none; border-color:var(--orange); }
  input[type=range] { width:100%; accent-color:var(--orange); margin-top:6px; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; margin-top:5px; }
  .chips button { font-size:11px; padding:7px 12px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .drop {
    border:1px dashed #3d3c33; padding:22px 16px; text-align:center;
    color:var(--muted); font-size:13px; transition:border-color .2s, background .2s;
  }
  .drop.over { border-color:var(--orange); background:#15110c; }
  .drop .have { color:var(--cream); }
  .drop .filebtn { margin-left:8px; }
  details { border:1px solid var(--line); padding:10px 12px; }
  details summary { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); cursor:pointer; }
  details .inner { display:grid; gap:12px; margin-top:12px; }

  #status {
    position:fixed; left:50%; bottom:22px; translate:-50% 0; z-index:50;
    background:var(--orange); color:var(--ground); font-size:13px; font-weight:600;
    padding:11px 20px; opacity:0; transition:opacity .25s; pointer-events:none;
  }
  #status.on { opacity:1; }
</style>
</head>
<body>

<header>
  <div>
    <h1>DARÉ · Cast and crew</h1>
    <div class="meta">One card per person. Kept in this browser. Date, venue and tickets go in the caption.</div>
  </div>
  <div class="bar">
    <button id="new" class="primary">New card</button>
    <button id="saveAll">Save every card</button>
    <a href="/rollout.html"><button>Rollout</button></a>
  </div>
</header>

<div class="wrap">
  <div class="studio">
    <div class="cards">
      <h3>Cards</h3>
      <div class="list" id="list"></div>
    </div>

    <div class="stage">
      <h3>Preview</h3>
      <canvas id="out"></canvas>
      <div class="note" id="note"></div>
      <div class="acts">
        <button id="savePng" class="primary">Save PNG</button>
        <button id="rec">Record clip</button>
        <button id="dup" class="quiet">Duplicate</button>
        <button id="del" class="quiet">Delete</button>
      </div>
    </div>

    <div class="controls" id="controls">
      <div class="chips" id="kinds"></div>
      <label class="f">Name<input type="text" data-f="name" placeholder="Shumba Maasai"></label>
      <div class="two">
        <label class="f">Part<input type="text" data-f="roleLabel" placeholder="Starring as"></label>
        <label class="f">&nbsp;<input type="text" data-f="role" placeholder="The Storyteller"></label>
      </div>
      <label class="f">One line<input type="text" data-f="note" placeholder="Zimbabwean born, London based"></label>

      <div class="drop" id="drop">
        <span id="dropText">Drop a picture or a clip, or</span>
        <label class="filebtn">Choose<input type="file" id="file" accept="image/*,video/*"></label>
      </div>
      <div class="chips" id="treats"></div>
      <div class="two">
        <label class="f">Across<input type="range" data-f="fx" min="0" max="1" step="0.01"></label>
        <label class="f">Up and down<input type="range" data-f="fy" min="0" max="1" step="0.01"></label>
      </div>
      <label class="f">Zoom<input type="range" data-f="zoom" min="1" max="2.5" step="0.01"></label>
      <div class="chips" id="fmts"></div>

      <details>
        <summary>Fine print</summary>
        <div class="inner">
          <label class="f">Heading on the frame<input type="text" data-f="heading" placeholder="Cast announcement"></label>
          <div class="two">
            <label class="f">Card number<input type="text" data-f="number" placeholder="DARE 001"></label>
            <label class="f">Document<input type="text" data-f="doc" placeholder="Identity card"></label>
          </div>
          <label class="f">On the stamp<input type="text" data-g="issuer"></label>
          <div><label class="f">Paper</label><div class="chips" id="papers"></div></div>
          <div><label class="f">Ground</label><div class="chips" id="grounds"></div></div>
        </div>
      </details>
    </div>
  </div>
</div>

<div id="status"></div>

<video id="src" playsinline muted loop crossorigin="anonymous" style="display:none"></video>
<div id="status"></div>

<script>
// ===========================================================
// DARÉ · CAST AND CREW
// An identity card drawn on a canvas: the frame around it is
// the poster's night, the card is paper. The same palette and
// type as the rollout. Cards and their pictures are kept in
// IndexedDB so they survive the page being closed.
// ===========================================================
const P = { ground:'#0b0d0c', cream:'#f9f5cd', orange:'#f43e00', muted:'#908f78', ink:'#17100a' };
const FONT = "Figtree,'Helvetica Neue',Arial,sans-serif";
const MONO = "'Courier New',Courier,monospace";
const FORMATS = {
  story:    { w:1080, h:1920, label:'Story 9:16' },
  portrait: { w:1080, h:1350, label:'Portrait 4:5' },
  square:   { w:1080, h:1080, label:'Square 1:1' },
};
const KINDS = {
  cast:  { label:'Cast',          heading:'Cast announcement', roleLabel:'Starring as' },
  crew:  { label:'Crew',          heading:'Crew announcement', roleLabel:'Role' },
  band:  { label:'Band',          heading:'The band',          roleLabel:'Playing' },
  guest: { label:'Special guest', heading:'Special guest',     roleLabel:'Appearing as' },
};
const TREATS = { sepia:'Sepia', mono:'Black and white', orange:'Orange', natural:'Natural' };

const GLOBAL_DEFAULT = { issuer:'Ancestral Futures', ground:'night', paper:'orange' };

// ---------- storage ----------
const DB = { name:'dare-cast', store:'cards' };
function openDb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB.name, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore(DB.store, { keyPath:'id' }); r.result.createObjectStore('settings', { keyPath:'key' }); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function dbAll() {
  const db = await openDb();
  return new Promise((res) => { const q = db.transaction(DB.store).objectStore(DB.store).getAll(); q.onsuccess = () => res(q.result || []); q.onerror = () => res([]); });
}
async function dbPut(card) {
  const db = await openDb();
  const copy = { ...card }; delete copy.el; delete copy.img; delete copy.url;
  return new Promise((res) => { const t = db.transaction(DB.store, 'readwrite'); t.objectStore(DB.store).put(copy); t.oncomplete = res; t.onerror = res; });
}
async function dbDelete(id) {
  const db = await openDb();
  return new Promise((res) => { const t = db.transaction(DB.store, 'readwrite'); t.objectStore(DB.store).delete(id); t.oncomplete = res; t.onerror = res; });
}
async function dbSetting(key, value) {
  const db = await openDb();
  return new Promise((res) => {
    const t = db.transaction('settings', 'readwrite');
    if (value === undefined) { const q = t.objectStore('settings').get(key); q.onsuccess = () => res(q.result ? q.result.value : undefined); q.onerror = () => res(undefined); }
    else { t.objectStore('settings').put({ key, value }); t.oncomplete = () => res(value); t.onerror = () => res(value); }
  });
}

// ---------- type helpers, as the rollout has them ----------
function tracked(ctx, text, tr) { let w = 0; for (const ch of text) w += ctx.measureText(ch).width + tr; return w - tr; }
function fillTracked(ctx, text, x, y, tr) { let cx = x; for (const ch of text) { ctx.fillText(ch, cx, y); cx += ctx.measureText(ch).width + tr; } }
function centreTracked(ctx, text, cx, y, tr) { fillTracked(ctx, text, cx - tracked(ctx, text, tr) / 2, y, tr); }
function fitTracked(ctx, text, maxW, size, trRatio, weight, family) {
  let s = size;
  for (let i = 0; i < 30; i++) {
    ctx.font = `${weight || 600} ${Math.round(s)}px ${family || FONT}`;
    if (tracked(ctx, text, s * trRatio) <= maxW) break;
    s *= 0.94;
  }
  return s;
}
function centreFit(ctx, text, cx, y, maxW, size, trRatio, weight) {
  const s = fitTracked(ctx, text, maxW, size, trRatio, weight);
  centreTracked(ctx, text, cx, y, s * trRatio);
  return s;
}
function leftFit(ctx, text, x, y, maxW, size, trRatio, weight) {
  const s = fitTracked(ctx, text, maxW, size, trRatio, weight);
  fillTracked(ctx, text, x, y, s * trRatio);
  return s;
}
const rnd = (seed) => () => { seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

// A tile of grain, laid over the night at a random offset each draw.
const grain = document.createElement('canvas');
(function () {
  grain.width = 256; grain.height = 256;
  const g = grain.getContext('2d'); const id = g.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = 180 + Math.random() * 75; id.data[i] = v; id.data[i + 1] = v * 0.45; id.data[i + 2] = 0; id.data[i + 3] = Math.random() < 0.6 ? 0 : 34; }
  g.putImageData(id, 0, 0);
})();

// The same grain in ink, for the orange ground.
const darkGrain = document.createElement('canvas');
(function () {
  darkGrain.width = 256; darkGrain.height = 256;
  const g = darkGrain.getContext('2d'); const id = g.createImageData(256, 256);
  for (let i = 0; i < id.data.length; i += 4) { const v = 10 + Math.random() * 40; id.data[i] = v; id.data[i + 1] = v * 0.6; id.data[i + 2] = 0; id.data[i + 3] = Math.random() < 0.55 ? 0 : 40; }
  g.putImageData(id, 0, 0);
})();

// ---------- the pieces of the card ----------
const ART = {};
function load(name, src) { return new Promise((res) => { const i = new Image(); i.onload = () => { ART[name] = i; res(); }; i.onerror = () => { ART[name] = null; res(); }; i.src = src; }); }
const stencil = document.createElement('canvas');
function drawArt(ctx, img, x, y, w, h, colour, alpha) {
  if (!img) return;
  stencil.width = Math.max(1, Math.round(w)); stencil.height = Math.max(1, Math.round(h));
  const s = stencil.getContext('2d'); s.clearRect(0, 0, stencil.width, stencil.height);
  s.drawImage(img, 0, 0, stencil.width, stencil.height);
  s.globalCompositeOperation = 'source-in'; s.fillStyle = colour; s.fillRect(0, 0, stencil.width, stencil.height);
  s.globalCompositeOperation = 'source-over';
  ctx.save(); ctx.globalAlpha = alpha === undefined ? 1 : alpha; ctx.drawImage(stencil, x, y, w, h); ctx.restore();
}

/* The fine wavy lines a passport page carries under its print, so a
   photocopy shows. Drawn once per card size and kept. */
const guillocheCache = {};
function guilloche(w, h) {
  const key = `${w}x${h}`;
  if (guillocheCache[key]) return guillocheCache[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  g.strokeStyle = P.orange; g.lineWidth = Math.max(1, w * 0.0012); g.globalAlpha = 0.22;
  const rows = 46;
  for (let i = 0; i < rows; i++) {
    g.beginPath();
    const y0 = (i / rows) * h * 1.15 - h * 0.08;
    for (let x = 0; x <= w; x += 6) {
      const y = y0 + Math.sin((x / w) * Math.PI * 6 + i * 0.35) * h * 0.035 + Math.sin((x / w) * Math.PI * 1.3 + i) * h * 0.02;
      if (x === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }
  guillocheCache[key] = c;
  return c;
}

// The picture in the window: cover, with the focus and zoom the card
// asks for, then the treatment. The orange is the poster's: greys taken
// out, darks to black and lights to orange.
const pic = document.createElement('canvas');
function drawPicture(ctx, source, x, y, w, h, card) {
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.fillStyle = card.treat === 'orange' ? '#1a0a02' : '#2a241c';
  ctx.fillRect(x, y, w, h);
  if (source) {
    const sw = source.videoWidth || source.naturalWidth || source.width;
    const sh = source.videoHeight || source.naturalHeight || source.height;
    if (sw && sh) {
      const k = Math.max(w / sw, h / sh) * (card.zoom || 1);
      const dw = sw * k, dh = sh * k;
      const dx = x + (w - dw) * (card.fx === undefined ? 0.5 : card.fx);
      const dy = y + (h - dh) * (card.fy === undefined ? 0.5 : card.fy);
      if (card.treat === 'natural') {
        ctx.drawImage(source, dx, dy, dw, dh);
      } else {
        pic.width = Math.max(1, Math.round(w)); pic.height = Math.max(1, Math.round(h));
        const g = pic.getContext('2d');
        g.filter = card.treat === 'orange' ? 'grayscale(1) contrast(1.35) brightness(0.95)' : card.treat === 'sepia' ? 'grayscale(1) contrast(1.12) brightness(1.04)' : 'grayscale(1) contrast(1.15)';
        g.drawImage(source, dx - x, dy - y, dw, dh);
        g.filter = 'none';
        if (card.treat === 'orange' || card.treat === 'sepia') {
          g.globalCompositeOperation = 'multiply'; g.fillStyle = card.treat === 'orange' ? P.orange : '#d2b685'; g.fillRect(0, 0, pic.width, pic.height);
          g.globalCompositeOperation = 'source-over';
        }
        ctx.drawImage(pic, x, y, w, h);
      }
    }
  } else {
    ctx.fillStyle = P.orange; ctx.globalAlpha = 0.5;
    ctx.font = `600 ${Math.round(w * 0.07)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('PHOTOGRAPH', x + w / 2, y + h / 2);
  }
  ctx.restore();
}

// The round stamp, text run round a circle, set down slightly askew.
function stamp(ctx, cx, cy, r, text, angle, ink) {
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(angle || -0.22);
  ctx.strokeStyle = ink || '#c8321a'; ctx.fillStyle = ink || '#c8321a'; ctx.globalAlpha = 0.8;
  ctx.lineWidth = r * 0.07; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
  ctx.lineWidth = r * 0.03; ctx.beginPath(); ctx.arc(0, 0, r * 0.72, 0, Math.PI * 2); ctx.stroke();
  ctx.font = `800 ${Math.round(r * 0.19)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const chars = [...text.toUpperCase()];
  const step = (Math.PI * 2) / chars.length;
  chars.forEach((ch, i) => {
    const a = -Math.PI / 2 + i * step;
    ctx.save(); ctx.rotate(a); ctx.translate(0, -r * 0.86); ctx.fillText(ch, 0, 0); ctx.restore();
  });
  ctx.font = `800 ${Math.round(r * 0.34)}px ${FONT}`;
  ctx.fillText('DARÉ', 0, -r * 0.06);
  ctx.font = `600 ${Math.round(r * 0.15)}px ${FONT}`;
  ctx.fillText('7 · XI · 2026', 0, r * 0.26);
  ctx.restore();
}

// The machine-readable lines: capitals and chevrons, as a passport has
// them, which is the one place the type is a monospace.
function mrz(text, len) {
  const clean = text.toUpperCase().replace(/[ÉÈÊ]/g, 'E').replace(/[ÁÀÂ]/g, 'A').replace(/[^A-Z0-9<]/g, '<');
  return (clean + '<'.repeat(len)).slice(0, len);
}

// ===========================================================
// THE CARD
// ===========================================================
/* Paper, made once per size and kept. Several layers of mottled noise
   at different scales, one over another, which is what a sheet looks
   like under a lamp: large soft clouds, smaller ones, then the fibres
   and the grain, the foxing, a darker edge, a fold. All drawn, so no
   two cards share a sheet unless they share a seed. */
const paperCache = {};
function cloud(w, h, cell, r) {
  const c = document.createElement('canvas'); c.width = Math.max(2, Math.ceil(w / cell)); c.height = Math.max(2, Math.ceil(h / cell));
  const g = c.getContext('2d'); const id = g.createImageData(c.width, c.height);
  for (let i = 0; i < id.data.length; i += 4) { const v = 110 + r() * 140; id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
  g.putImageData(id, 0, 0); return c;
}
function paper(w, h, seed, tone) {
  const key = `${w}x${h}:${seed}:${tone}`;
  const T = tone === 'orange'
    ? { base:'#f43e00', dark:'rgba(70,15,0,', light:'rgba(255,200,160,', fox:'rgba(70,15,0,', edge:'rgba(60,10,0,', foldHi:'rgba(255,200,170,0.4)' }
    : { base:'#e3d7b4', dark:'rgba(100,70,35,', light:'rgba(255,250,235,', fox:'rgba(135,90,35,', edge:'rgba(80,50,15,', foldHi:'rgba(255,250,232,0.45)' };
  if (paperCache[key]) return paperCache[key];
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); const r = rnd(seed);
  g.fillStyle = T.base; g.fillRect(0, 0, w, h);
  g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  // the clouds, coarse to fine, each laid on as light and shade
  for (const [cell, alpha] of [[w / 5, 0.5], [w / 12, 0.35], [w / 30, 0.25], [w / 80, 0.18]]) {
    g.save(); g.globalCompositeOperation = 'overlay'; g.globalAlpha = tone === 'orange' ? alpha * 0.6 : alpha;
    g.drawImage(cloud(w, h, cell, r), -cell, -cell, w + cell * 2, h + cell * 2); g.restore();
  }
  // the orange is kept the poster's own, the clouds only shading it
  if (tone === 'orange') { g.save(); g.globalCompositeOperation = 'multiply'; g.fillStyle = 'rgba(225,70,10,0.5)'; g.fillRect(0, 0, w, h); g.restore(); }
  // the grain
  const img = g.getImageData(0, 0, w, h); const d = img.data;
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * 22; d[i] += n; d[i + 1] += n; d[i + 2] += n * 0.8; }
  g.putImageData(img, 0, 0);
  // the fibres, a few long and many short, both ways
  for (let i = 0; i < (w * h) / 500; i++) {
    const x = r() * w, y = r() * h, a = r() * Math.PI, l = 3 + r() * (r() < 0.1 ? 60 : 16);

// ===========================================================
// THE CARD
// ===========================================================
function draw(ctx, W, H, card, G, source, t) {

  ctx.fillStyle = '#f3ecd6'; ctx.fillRect(px - cw * 0.012, py - cw * 0.012, pw + cw * 0.024, ph + cw * 0.03);

}

// ===========================================================
// THE PAGE
// ===========================================================
const out = document.getElementById('out');
const video = document.getElementById('src');

let current = null;

let G = { ...GLOBAL_DEFAULT };

const uid = () => 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

function newCard(kind) {
  const n = cards.length + 1;
  return { id: uid(), kind: kind || 'cast', heading: '', name: '', roleLabel: '', role: '', note: '', number: `DARE ${String(n).padStart(3, '0')}`, doc: 'Identity card',
           treat: 'sepia', fx: 0.5, fy: 0.35, zoom: 1, seed: Math.floor(Math.random() * 1e6), media: null, mediaType: '', mediaName: '' };
}

// The media each card holds, as something the canvas can draw. Pictures

// whichever card is being looked at.

// ---------- the list ----------
function redrawThumb(card) {
  if (!card.el) return;
  const c = card.el.querySelector('canvas');
  render(c, card, 'square', 0);
  card.el.querySelector('.who').textContent = card.name || 'Unnamed';
  card.el.querySelector('.what').textContent = [card.roleLabel || KINDS[card.kind].roleLabel, card.role].filter(Boolean).join(' ') || KINDS[card.kind].label;
}

  const list = document.getElementById('list'); list.innerHTML = '';

    const el = document.createElement('div'); el.className = 'card' + (card === current ? ' on' : '');
    el.innerHTML = '<canvas></canvas><div><div class="who"></div><div class="what"></div></div>';
    el.onclick = () => select(card);
    card.el = el; list.appendChild(el); redrawThumb(card);
  }
  if (!cards.length) list.innerHTML = '<p style="font-size:13px;color:var(--muted)">No cards yet. Press New card.</p>';
}

  fillControls();
}

// ---------- the controls ----------
const fields = ['heading', 'name', 'roleLabel', 'role', 'note', 'number', 'doc', 'fx', 'fy', 'zoom'];
function fillControls() {
  const c = document.getElementById('controls');
  for (const f of fields) { const i = c.querySelector(`[data-f="${f}"]`); if (i) i.value = current ? (current[f] ?? '') : ''; }
  const kinds = document.getElementById('kinds');
  kinds.innerHTML = Object.keys(KINDS).map((k) => `<button data-kind="${k}"${current && current.kind === k ? ' class="on"' : ''}>${KINDS[k].label}</button>`).join('');
  kinds.querySelectorAll('button').forEach((b) => { b.onclick = () => { if (!current) return; current.kind = b.dataset.kind; fillControls(); changed(); }; });
  const treats = document.getElementById('treats');
  treats.innerHTML = Object.keys(TREATS).map((k) => `<button data-treat="${k}"${current && current.treat === k ? ' class="on"' : ''}>${TREATS[k]}</button>`).join('');
  treats.querySelectorAll('button').forEach((b) => { b.onclick = () => { if (!current) return; current.treat = b.dataset.treat; fillControls(); changed(); }; });
  c.querySelector('[data-f="heading"]').placeholder = current ? KINDS[current.kind].heading : '';
  c.querySelector('[data-f="roleLabel"]').placeholder = current ? KINDS[current.kind].roleLabel : '';
  document.getElementById('dropText').innerHTML = current && current.mediaName
    ? `<span class="have">${current.mediaName.replace(/</g, '&lt;')}</span> · drop another to swap it, or`
    : 'Drop a picture or a clip here, or';

  document.getElementById('savePng').disabled = !current;
  document.getElementById('dup').disabled = !current;
  document.getElementById('del').disabled = !current;
}
let saveTimer = null;
function changed() {
  if (!current) return;
  redrawThumb(current);
  clearTimeout(saveTimer); saveTimer = setTimeout(() => dbPut(current), 400);
}

function takeFile(file) {
  if (!current) { toast('Make a card first'); return; }
  if (!file || !(file.type.startsWith('image/') || file.type.startsWith('video/'))) { toast('That is not a picture or a clip'); return; }
  if (current.url) { URL.revokeObjectURL(current.url); current.url = null; }
  current.img = null; current.media = file; current.mediaType = file.type; current.mediaName = file.name;
  if (video.dataset.card === current.id) video.dataset.card = '';
  fillControls(); changed();
  toast(file.type.startsWith('video/') ? 'Clip in. It plays in the window.' : 'Picture in.');

// ---------- saving ----------
function save(blob, name) { const u = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = u; a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(u), 4000); }

const scratch = document.createElement('canvas');

  // a picture that has not decoded yet gets a moment

  render(scratch, card, fmt, 0);

  const card = current; let saved = false;
  try {
    for (const type of types) {
      let blob = null, why = '';
      try { blob = await recordOnce(type, card); } catch (e) { why = e.message; }
      if (blob && blob.size >= 150_000) {
        const ext = type.startsWith('video/mp4') ? 'mp4' : 'webm';
        save(blob, `DARE_${card.kind}_${slug(card.name)}_${fmt}.${ext}`);
        toast(`Saved as ${ext.toUpperCase()}, ${(blob.size / 1e6).toFixed(1)} MB`); saved = true; break;
      }
      progress(`${type.split(';')[0]} came out ${blob ? 'empty' : 'with an error'}${why ? ' (' + why + ')' : ''}. Trying the next format.`);
      await new Promise((r) => setTimeout(r, 800));
    }
    if (!saved) toast('Could not record in this browser. Try Chrome with this tab in front.');
  } finally { recording = false; document.getElementById('rec').disabled = false; if (saved) progress(''); }
}

// ---------- wiring ----------
function build() {
  const c = document.getElementById('controls');
  for (const f of fields) {
    const i = c.querySelector(`[data-f="${f}"]`); if (!i) continue;
    i.oninput = () => { if (!current) return; current[f] = i.type === 'range' ? Number(i.value) : i.value; changed(); };
  }
  c.querySelectorAll('[data-g]').forEach((i) => { i.value = G[i.dataset.g] || ''; i.oninput = () => { G[i.dataset.g] = i.value; dbSetting('global', G); cards.forEach(redrawThumb); }; });
  const grounds = document.getElementById('grounds');
  const paintGrounds = () => {
    grounds.innerHTML = [['orange', 'Orange'], ['night', 'Night']].map(([k, l]) => `<button data-ground="${k}"${(G.ground || 'orange') === k ? ' class="on"' : ''}>${l}</button>`).join('');
    grounds.querySelectorAll('button').forEach((b) => { b.onclick = () => { G.ground = b.dataset.ground; dbSetting('global', G); cards.forEach(redrawThumb); paintGrounds(); }; });
  };
  paintGrounds();
  const papers = document.getElementById('papers');
  const paintPapers = () => {
    papers.innerHTML = [['orange', 'Orange'], ['cream', 'Cream']].map(([k, l]) => `<button data-paper="${k}"${(G.paper || 'orange') === k ? ' class="on"' : ''}>${l}</button>`).join('');
    papers.querySelectorAll('button').forEach((b) => { b.onclick = () => { G.paper = b.dataset.paper; dbSetting('global', G); cards.forEach(redrawThumb); paintPapers(); }; });
  };
  paintPapers();
  const fmts = document.getElementById('fmts');
  fmts.innerHTML = Object.keys(FORMATS).map((k) => `<button data-fmt="${k}"${k === fmt ? ' class="on"' : ''}>${FORMATS[k].label}</button>`).join('');
  fmts.querySelectorAll('button').forEach((b) => { b.onclick = () => { fmt = b.dataset.fmt; fmts.querySelectorAll('button').forEach((o) => o.classList.toggle('on', o === b)); }; });

  const drop = document.getElementById('drop');
  document.getElementById('file').onchange = (e) => { takeFile(e.target.files[0]); e.target.value = ''; };
  drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); takeFile(e.dataTransfer.files[0]); };
  document.body.ondragover = (e) => e.preventDefault();
  document.body.ondrop = (e) => { e.preventDefault(); takeFile(e.dataTransfer.files[0]); };

  document.getElementById('new').onclick = async () => { const card = newCard('cast'); cards.push(card); await dbPut(card); buildList(); select(card); toast('New card'); };
  document.getElementById('dup').onclick = async () => {
    if (!current) return;
    const copy = { ...current, id: uid(), el: null, img: null, url: null, number: `DARE ${String(cards.length + 1).padStart(3, '0')}` };
    cards.splice(cards.indexOf(current) + 1, 0, copy); await dbPut(copy); buildList(); select(copy); toast('Copied');
  };
  document.getElementById('del').onclick = async () => {
    if (!current) return;
    if (!confirm(`Delete the card for ${current.name || 'this person'}?`)) return;
    const i = cards.indexOf(current); await dbDelete(current.id); cards.splice(i, 1); current = cards[Math.min(i, cards.length - 1)] || null;
    buildList(); fillControls(); toast('Deleted');
  };
  document.getElementById('savePng').onclick = () => current && savePng(current);
  document.getElementById('rec').onclick = record;
  document.getElementById('saveAll').onclick = async () => {
    let n = 0; for (const card of cards) { await savePng(card); n++; toast(`Saving ${n} of ${cards.length}`); await new Promise((r) => setTimeout(r, 300)); }
    toast(`${n} cards saved`);
  };
  out.onclick = () => current && savePng(current);
  progress(supported().length ? `Preview. Records as ${supported()[0].startsWith('video/mp4') ? 'MP4' : 'WebM'}, with WebM as the fallback.` : 'Preview. This browser cannot record clips; Chrome can.');
}

/* /cast.html?export=1&fmt=story draws one sample card alone at full size,
   for a headless screenshot, the same as the other tools. */
async function exportSample(f) {
  if (!FORMATS[f]) f = 'story';
  const card = { ...newCard('cast'), name: 'Shumba Maasai', role: 'The Storyteller', note: 'Zimbabwean born, London based', number: 'DARE 001' };
  await new Promise((res) => { const i = new Image(); i.onload = () => { card.img = i; card.media = true; card.mediaType = 'image/jpeg'; res(); }; i.onerror = res; i.src = '/night/charisse.jpg'; });
  card.fy = 0.15; card.zoom = 1.25;
  const c = document.createElement('canvas'); render(c, card, f, 0);
  document.body.innerHTML = ''; document.body.style.cssText = 'margin:0;background:#000;overflow:hidden';
  c.style.cssText = `display:block;width:${c.width}px;height:${c.height}px`; document.body.appendChild(c);
}

(async function () {
  await Promise.all([load('word', '/art/wordmark.png'), load('hutline', '/art/hut-line.png')]);
  if (document.fonts && document.fonts.ready) await document.fonts.ready;
  const q = new URLSearchParams(location.search);
  if (q.has('export')) { await exportSample(q.get('fmt') || 'story'); return; }
  try { const g = await dbSetting('global'); if (g) G = { ...GLOBAL_DEFAULT, ...g }; } catch (e) {}
  try { cards = await dbAll(); } catch (e) { cards = []; }
  for (const card of cards) { card.el = null; card.img = null; card.url = null; }
  build();
  buildList();
  if (cards.length) select(cards[0]); else fillControls();
  loop();
})();
</script>
